name: Restore deductive snapshots

on:
  push:
    paths-ignore:
      - "public/question-assets/**"
      - ".github/workflows/restore-deductive-snapshots.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the historical final asset archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deductive-assets
          mkdir -p /tmp/deductive-assets
          git show 31247d7cbfd55c814592279e1a101e1bf77151c4:Aptitude-question-assets-final.zip > /tmp/Aptitude-question-assets-final.zip
          unzip -q /tmp/Aptitude-question-assets-final.zip -d /tmp/deductive-assets

          mkdir -p public/question-assets
          for test_id in TEST_030 TEST_031 TEST_032 TEST_033; do
            count=$(find /tmp/deductive-assets -type f -iname "${test_id}_Q*.webp" | wc -l | tr -d ' ')
            if [ "$count" -ne 22 ]; then
              echo "Expected 22 snapshots for ${test_id}, found ${count}"
              find /tmp/deductive-assets -type f -iname "${test_id}_Q*.webp" -print
              exit 1
            fi
            find /tmp/deductive-assets -type f -iname "${test_id}_Q*.webp" -exec cp {} public/question-assets/ \;
          done

          total=$(find public/question-assets -maxdepth 1 -type f \( -iname 'TEST_030_Q*.webp' -o -iname 'TEST_031_Q*.webp' -o -iname 'TEST_032_Q*.webp' -o -iname 'TEST_033_Q*.webp' \) | wc -l | tr -d ' ')
          if [ "$total" -ne 88 ]; then
            echo "Expected 88 deductive snapshots, found ${total}"
            exit 1
          fi

      - name: Commit snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/question-assets/TEST_030_Q*.webp public/question-assets/TEST_031_Q*.webp public/question-assets/TEST_032_Q*.webp public/question-assets/TEST_033_Q*.webp
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "feat: add actual deductive question snapshots"
          git push