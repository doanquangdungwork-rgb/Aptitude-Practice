name: restore-full-question-bank
on:
  push:
    branches: [main]
    paths:
      - '.question-bank/chunk0'
      - '.question-bank/chunk1'
      - '.question-bank/chunk2'
      - '.question-bank/chunk3'
      - '.github/workflows/restore-full-question-bank.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and validate
        run: |
          python - <<'PY'
          import base64
          s=open('.question-bank/chunk0','r',encoding='utf-8').read().strip()
          c1=open('.question-bank/chunk1','rb').read()
          assert len(s) % 4 == 2, len(s)
          with open('/tmp/questions.xz','wb') as out:
              out.write(base64.b64decode(s[:-2]))
              bridge=s[-2:] + base64.b64encode(c1[:2]).decode()[:2]
              out.write(base64.b64decode(bridge))
              out.write(c1[2:])
              out.write(open('.question-bank/chunk2','rb').read())
              out.write(open('.question-bank/chunk3','rb').read())
          PY
          xz -dc /tmp/questions.xz > data/questions.json
          test "$(wc -c < data/questions.json)" -eq 685977
          test "$(sha256sum data/questions.json | cut -d' ' -f1)" = "d8754c39b1ecc90aaabda95f2f855e6160bdf2f2ef3331c618a07b9e3e8a769d"
          python - <<'PY'
          import json
          data=json.load(open('data/questions.json'))
          assert len(data)==2730, len(data)
          assert len({q['testId'] for q in data})==122
          assert all(q.get('a') is not None for q in data)
          print('VALIDATED', len(data), 'questions across 122 tests')
          PY
      - name: Commit full bank
        run: |
          rm -rf .question-bank .github/workflows/restore-full-question-bank.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          git add -u
          git commit -m "data: restore full source question bank"
          git push
