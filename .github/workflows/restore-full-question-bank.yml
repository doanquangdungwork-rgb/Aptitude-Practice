name: restore-full-question-bank
on:
  push:
    branches: [main]
    paths:
      - '.question-bank/chunk0'
      - '.question-bank/chunk1'
      - '.question-bank/chunk2'
      - '.question-bank/chunk3'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and validate
        run: |
          cat .question-bank/chunk0 .question-bank/chunk1 .question-bank/chunk2 .question-bank/chunk3 > /tmp/questions.xz.b64
          base64 -d /tmp/questions.xz.b64 > /tmp/questions.xz
          xz -dc /tmp/questions.xz > data/questions.json
          test "$(wc -c < data/questions.json)" -eq 1278197
          test "$(sha256sum data/questions.json | cut -d' ' -f1)" = "297dbd03ea1737b29ab6a8c68c0445271cf3292ffa43d8e91587150922fcba52"
          python - <<'PY'
          import json
          p='data/questions.json'
          data=json.load(open(p))
          assert len(data)==2730, len(data)
          tests={}
          for q in data:
              tests.setdefault(q['testId'],0)
              tests[q['testId']]+=1
          assert len(tests)==122, len(tests)
          assert all(q.get('a') is not None for q in data)
          print('VALIDATED', len(data), 'questions across', len(tests), 'tests')
          PY
      - name: Commit full bank
        run: |
          rm -rf .question-bank .github/workflows/restore-full-question-bank.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          git add -u
          git commit -m "data: restore full source question bank"
          git push
